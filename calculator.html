<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="A simple calculator for addition, subtraction, multiplication and division.">
    <title>Calculator</title>
    <link rel="stylesheet" href="calculator.css">
</head>
<body>
    <main class="calculator-container">
        <section class="calculator" aria-labelledby="calculator-title">

            <header class="calculator-header">
                <h1 id="calculator-title">Calculator</h1>
                <p class="subtitle">Enter two numbers, choose an operation, and get your answer instantly.</p>
            </header>

            <form id="calculator-form" novalidate>

                <div class="expression-grid">
                    <div class="form-group">
                        <label for="first-number">First number</label>
                        <input
                            type="number"
                            id="first-number"
                            name="first-number"
                            step="any"
                            placeholder="e.g. 25"
                            inputmode="decimal"
                            autocomplete="off"
                            required
                        >
                    </div>

                    <div class="form-group">
                        <label for="operation">Operation</label>
                        <select id="operation" name="operation" required>
                            <option value="+">Add (+)</option>
                            <option value="-">Subtract (−)</option>
                            <option value="*">Multiply (×)</option>
                            <option value="/">Divide (÷)</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label for="second-number">Second number</label>
                        <input
                            type="number"
                            id="second-number"
                            name="second-number"
                            step="any"
                            placeholder="e.g. 5"
                            inputmode="decimal"
                            autocomplete="off"
                            required
                        >
                    </div>
                </div>

                <div class="button-group">
                    <button type="submit" class="btn btn-primary">Calculate</button>
                    <button type="button" id="reset-btn" class="btn btn-secondary">Clear</button>
                </div>

                <div class="result-container">
                    <h2>Result</h2>
                    <output id="result" aria-live="polite" for="first-number operation second-number">Your answer will appear here.</output>
                </div>

                <footer class="calculator-footer">
                    <button type="button" id="exit-btn" class="btn btn-exit">Exit Calculator</button>
                </footer>

            </form>
        </section>
    </main>

    <script src="calculator.js"></script>
</body>
</html>
