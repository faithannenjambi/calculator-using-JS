<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculator</title>
    <link rel="stylesheet" href="calculator.css">
</head>
<body>
    <main class="calculator-container">
        <section class="calculator" aria-labelledby="calculator-title">
            <h1 id="calculator-title">Calculator</h1>

            <form id="calculator-form" novalidate>
                <div class="form-group">
                    <label for="first-number">First number</label>
                    <input
                        type="number"
                        id="first-number"
                        name="first-number"
                        step="any"
                        placeholder="Enter a number"
                        required
                    >
                </div>

                <div class="form-group">
                    <label for="operation">Operation</label>
                    <select id="operation" name="operation" required>
                        <option value="+">Addition (+)</option>
                        <option value="-">Subtraction (−)</option>
                        <option value="*">Multiplication (×)</option>
                        <option value="/">Division (÷)</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="second-number">Second number</label>
                    <input
                        type="number"
                        id="second-number"
                        name="second-number"
                        step="any"
                        placeholder="Enter a number"
                        required
                    >
                </div>

                <div class="button-group">
                    <button type="submit" class="btn btn-primary">Calculate</button>
                    <button type="button" id="reset-btn" class="btn btn-secondary">Reset</button>
                </div>

                <div class="result-container">
                    <h2>Result</h2>
                    <output id="result" aria-live="polite">Enter two numbers and select an operation.</output>
                </div>

                <button type="button" id="exit-btn" class="btn btn-exit">Exit Calculator</button>
            </form>
        </section>
    </main>

    <script src="calculator.js"></script>
</body>
</html>
